name: Build TrollOpenJB-Shortcuts

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git
          cd theos
          git submodule update --init --recursive
      
      - name: Download iOS SDK
        run: |
          # 使用 iPhoneOS14.5 SDK (与新版 Xcode 兼容)
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout init --cone
          git sparse-checkout set iPhoneOS14.5.sdk
          cd ..
          mv sdks/iPhoneOS14.5.sdk theos/sdks/
          rm -rf sdks
      
      - name: Build Package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make package FINALPACKAGE=1
      
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: TrollOpenJB-Shortcuts
          path: TrollOpenJB-Shortcuts/packages/*.deb
          retention-days: 30
